name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: bun install
      - run: bun add @capacitor/core @capacitor/cli @capacitor/android
      - run: bun run build
      - name: Capacitor config
        run: |
          echo '{"appId":"com.depth.wallpaper","appName":"Depth Wallpaper","webDir":"dist"}' > capacitor.config.json
      - run: bunx cap add android
      - run: bunx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wallpaper-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
